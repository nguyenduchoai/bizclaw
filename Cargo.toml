[package]
name = "bizclaw"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fast, small, and fully autonomous AI assistant infrastructure with local brain"
default-run = "bizclaw"

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
bizclaw-core.workspace = true
bizclaw-brain.workspace = true
bizclaw-providers.workspace = true
bizclaw-channels.workspace = true
bizclaw-memory.workspace = true
bizclaw-tools.workspace = true
bizclaw-security.workspace = true
bizclaw-agent.workspace = true
bizclaw-mcp.workspace = true
bizclaw-scheduler.workspace = true
bizclaw-knowledge.workspace = true
bizclaw-gateway.workspace = true
bizclaw-db.workspace = true
bizclaw-platform.workspace = true
bizclaw-hands.workspace = true
bizclaw-agi.workspace = true

tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio-stream.workspace = true
futures.workspace = true
reqwest.workspace = true
shellexpand.workspace = true
rand.workspace = true
chrono.workspace = true
open = "5"

[[bin]]
name = "bizclaw"
path = "src/main.rs"

[[bin]]
name = "bizclaw-platform"
path = "src/platform_main.rs"

[[bin]]
name = "bizclaw-local"
path = "src/local_main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
