# ── Workspace-wide lint policy ──────────────────────────
[workspace.lints.clippy]
unwrap_used = "warn"         # Prefer ? or .expect("reason") over bare .unwrap()
large_futures = "warn"       # Catch oversized futures that bloat async stacks
manual_let_else = "warn"     # Use let-else for cleaner early returns

[workspace.lints.rust]
# unsafe_code = "deny"       # Uncomment when SIMD module is gated behind feature flag

[workspace.package]
version = "1.1.7"
edition = "2024"
authors = ["BizClaw Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nguyenduchoai/bizclaw-cloud"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HTTP
reqwest = { version = "0.12", features = ["json", "cookies", "socks", "stream", "gzip", "brotli", "deflate", "multipart"] }
# Error handling
thiserror = "2"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# CLI
clap = { version = "4", features = ["derive"] }
# Async utilities
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
# Crypto
aes = "0.8"
aes-gcm = "0.10"
rsa = "0.9.6"
sha2 = "0.11"
hmac = "0.12"
base64 = "0.22"
# Database
rusqlite = { version = "0.32", features = ["bundled"] }
# Memory mapping
memmap2 = "0.9"
# Parallelism
rayon = "1"
# FP16
half = "2"
# Binary parsing
byteorder = "1"
# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
rand = "0.8"
dirs = "6"
shellexpand = "3"
hostname = "0.4"
whoami = "1"
# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# URL parsing
url = "2"
# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
native-tls = "0.2"
mail-parser = "0.9"
# Database abstraction
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "any", "chrono", "json", "uuid", "migrate"] }
# PDF processing for RAG
pdf_oxide = "0.3"
zip = "2"
tempfile = "3"
urlencoding = "2.1.3"
regex = "1"
cookie_store = "0.21"

# Internal crates
bizclaw-core = { path = "crates/bizclaw-core" }
bizclaw-brain = { path = "crates/bizclaw-brain" }
bizclaw-providers = { path = "crates/bizclaw-providers" }
bizclaw-channels = { path = "crates/bizclaw-channels" }
bizclaw-memory = { path = "crates/bizclaw-memory" }
bizclaw-memory-redb = { path = "crates/bizclaw-memory-redb" }
