[package]
name = "bizclaw-ecommerce-vn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Vietnamese E-commerce MCP Gateway - Sapo, Haravan, KiotViet, LadiSales integration"
readme = "README.md"
repository.workspace = true

[dependencies]
bizclaw-core.workspace = true
bizclaw-mcp.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
aes-gcm.workspace = true
base64.workspace = true

rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[features]
default = []
sapo = []
haravan = []
kiotviet = []
ladisales = []
all = ["sapo", "haravan", "kiotviet", "ladisales"]
